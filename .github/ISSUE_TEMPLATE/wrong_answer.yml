name: Wrong answer
description: The assistant gave a wrong, incomplete or odd answer.
labels: ["answer quality"]
body:
  - type: markdown
    attributes:
      value: |
        Answers come from a small model running on your computer, so they will sometimes be wrong.
        Each report helps tune it. **Issues are public:** only describe documents you are free to share.
  - type: input
    id: version
    attributes:
      label: Leafrune version
      description: Help ▸ About Leafrune
      placeholder: 0.9.2 Beta
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: Exactly as you typed it.
    validations:
      required: true
  - type: textarea
    id: answer
    attributes:
      label: The assistant's answer
      description: Use the copy button under the answer and paste it here.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: The right answer, and the page it is on
      placeholder: "Page 12 says …"
    validations:
      required: true
  - type: input
    id: document
    attributes:
      label: Document
      description: >
        A link to a public PDF (or "self-made"), its language and roughly how many pages.
        Do not upload confidential documents.
      placeholder: "https://… (English, 40 pages)"
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not attach confidential documents or private text.
          required: true
