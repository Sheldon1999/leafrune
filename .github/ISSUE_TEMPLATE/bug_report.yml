name: Bug report
description: Something in Leafrune does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Leafrune.
        **Issues are public.** Do not attach confidential PDFs or paste private text.
        For a wrong or odd assistant answer, use the **Wrong answer** form instead.
  - type: input
    id: version
    attributes:
      label: Leafrune version
      description: Help ▸ About Leafrune
      placeholder: 0.9.2 Beta
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Settings ▸ System ▸ About ▸ Windows specifications
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to see the problem
      placeholder: |
        1. Open a PDF with …
        2. Click …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: A screenshot helps (without private content).
    validations:
      required: true
  - type: dropdown
    id: document
    attributes:
      label: Does it happen with every PDF?
      options:
        - Yes, with every PDF
        - Only with some PDFs
        - It does not depend on the PDF
        - I don't know
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not attach confidential documents or private text.
          required: true
